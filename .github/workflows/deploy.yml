name: CI/CD Docker Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Api-Enviroment

    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
  
        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3

        - name: Login to DockerHub
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}

        - name: Build and Push Docker Image
          uses: docker/build-push-action@v5
          with:
            context: .
            push: true
            tags: ${{ secrets.DOCKERHUB_USERNAME }}/dj-api:latest
            platforms: linux/arm64

        - name: Deploy to Oracle VM via SSH
          uses: appleboy/ssh-action@v0.1.10
          with:
            host: ${{ secrets.VM_HOST }}
            username: ${{ secrets.VM_USER }}
            key: ${{ secrets.VM_PRIVATE_KEY }}
            script: |
                docker pull ${{ secrets.DOCKERHUB_USERNAME }}/dj-api:latest
                docker stop dj-api || true
                docker rm dj-api-api || true
                docker run -d --network docker_network-main --name dj-api -p 5000:5000 \
                -e PORT=5000 \
                -e CLOUDINARY_URL=${{ secrets.CLOUDINARY_URL }} \
                -e MONGO_URI=${{ secrets.MONGO_URI }} \
                -e CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }} \
                -e CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }} \
                -e CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET}} \
                -e JWT_SECRET=${{ secrets.JWT_SECRET }} \
                ${{ secrets.DOCKERHUB_USERNAME }}/dj-api:latest